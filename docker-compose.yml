version: '3.9'

services:
  db:
    image: postgres:14.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doorbell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doorbell}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: ./code
      dockerfile: migrations/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-doorbell}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./code:/app
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        cd /app &&
        python -c 'import time; time.sleep(5)' &&
        python run_migrations.py
      "

  bellkeeper:
    build:
      context: ./code
      dockerfile: bellkeeper/Dockerfile
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-doorbell}
      - POSTGRES_HOST=db
    volumes:
      - ./code:/app

  bellwatch:
    build:
      context: ./code
      dockerfile: bellwatch/Dockerfile
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-doorbell}
      - POSTGRES_HOST=db
      - WATCH_PATH=/photos
    volumes:
      - ./code:/app
      - ${PHOTOS_PATH:-./photos}:/photos

volumes:
  postgres_data:

